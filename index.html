<script>
const PLAYERS = { anil: "Anıl", semih: "Semih" };
firebase.initializeApp(CONFIG.firebase);
const db = firebase.database();
const matchesRef = db.ref("matches");
const keysRef = db.ref("keys");
const suggestionsRef = db.ref("suggestions");
const commentsRef = db.ref("comments");

let state = {
  user: localStorage.getItem("skor_user") || null,
  loginPick: "anil",
  matches: [],
  suggestions: [],
  comments: [],
  keys: { anil: CONFIG.ANIL_KEY, semih: CONFIG.SEMIH_KEY },
  showPasswordForm: false,
  passwordMsg: "",
};

// ---------------- FIREBASE OKUMA / YAZMA ----------------
async function saveData(){
  await matchesRef.set(state.matches);
}

async function saveKey(user, newKey){
  await keysRef.child(user).set(newKey);
}

async function saveSuggestions(){
  await suggestionsRef.set(state.suggestions);
}

async function saveComments(){
  await commentsRef.set(state.comments);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

// ---------------- PUAN HESAPLAMA ----------------
// Kesin skor: 5. Diğer durumlarda: taban puan (gol farkı doğru: 3, sadece sonuç doğru: 2, ikisi de yanlış: 0)
// + yakınlık bonusu (ev sahibi skoru gerçeğe en fazla 1 fark yakınsa +1, deplasman için de aynı, toplam en fazla +2).
function calcPoints(predStr, resHome, resAway){
  if (!predStr) return { points: 0, reason: "tahmin girilmedi" };
  const parts = predStr.split("-").map(Number);
  if (parts.length !== 2 || isNaN(parts[0]) || isNaN(parts[1])) return { points: 0, reason: "geçersiz tahmin" };
  const [ph, pa] = parts;

  if (ph === resHome && pa === resAway){
    return { points: 5, reason: "skor birebir tuttu" };
  }

  const predDiff = ph - pa;
  const realDiff = resHome - resAway;
  const sign = n => n > 0 ? 1 : (n < 0 ? -1 : 0);
  const diffMatch = predDiff === realDiff;
  const outcomeMatch = sign(predDiff) === sign(realDiff);
  const base = diffMatch ? 3 : (outcomeMatch ? 2 : 0);

  const homeDiff = Math.abs(ph - resHome);
  const awayDiff = Math.abs(pa - resAway);
  const proxBonus = (homeDiff <= 1 ? 1 : 0) + (awayDiff <= 1 ? 1 : 0);

  const points = base + proxBonus;
  const baseLabel = diffMatch ? "gol farkı tuttu" : (outcomeMatch ? "sonuç tuttu" : "sonuç tutmadı");
  const reason = proxBonus > 0 ? `${baseLabel}, yakınlık +${proxBonus} (${base}+${proxBonus})` : `${baseLabel} (+${base})`;
  return { points, reason };
}

// ---------------- İNTERNETTEN SKOR ÇEKME (TheSportsDB, ücretsiz test key) ----------------
async function fetchRealScore(home, away, kickoffIso){
  const eventName = `${home}_vs_${away}`.replace(/\s+/g, "_");
  const url = `https://www.thesportsdb.com/api/v1/json/3/searchevents.php?e=${encodeURIComponent(eventName)}`;
  try{
    const res = await fetch(url);
    const data = await res.json();
    if (!data || !data.event || !data.event.length) return null;
    const targetDate = kickoffIso.slice(0,10);
    const match = data.event.find(e => e.dateEvent === targetDate) || data.event[0];
    if (!match || match.intHomeScore === null || match.intHomeScore === undefined || match.intAwayScore === null) return null;
    return { home: Number(match.intHomeScore), away: Number(match.intAwayScore) };
  }catch(e){
    return null;
  }
}

// ---------------- RENDER ----------------
function render(){
  document.getElementById("app").innerHTML = state.user ? renderApp() : renderLogin();
  bindEvents();
}

function getMatchList(){
  return state.matches.map(m => ({...m, kickoffMs: new Date(m.kickoff).getTime()}));
}

function renderLogin(){
  const list = getMatchList();
  return `
    ${renderTicker(false)}

    ${renderLeague(list)}

    <div class="login-card">
      <h1>Skor Tahmin <span>Ligi</span></h1>
      <p>Maçtan önce tahminini gir, maç saatinde skorlar açılır.</p>
      <div class="player-pick">
        <button data-pick="anil" class="${state.loginPick==='anil'?'active':''}">Anıl</button>
        <button data-pick="semih" class="${state.loginPick==='semih'?'active':''}">Semih</button>
      </div>
      <input type="password" id="keyInput" placeholder="Şifre" autocomplete="off">
      <div class="err" id="loginErr"></div>
      <button class="btn" id="loginBtn">Giriş yap</button>
    </div>
  `;
}

function renderTicker(showForm = true){
  const sorted = [...state.comments].sort((a,b)=>a.createdAt-b.createdAt);
  let track;
  if (sorted.length){
    const itemsHtml = sorted.map(c => `
      <span class="ticker-item"><b>${PLAYERS[c.user]}:</b>${escapeHtml(c.text)}<span class="tdate">${new Date(c.createdAt).toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit"})}</span></span>
    `).join("");
    track = `<div class="ticker-track">${itemsHtml}${itemsHtml}</div>`;
  } else {
    track = `<div class="ticker-track" style="animation:none;"><span class="ticker-item">Henüz yorum yok.</span></div>`;
  }
  return `
    <div class="ticker-section">
      <div class="ticker-title">Futbol Yorumları</div>
      <div class="ticker-box">${track}</div>
      ${showForm ? `
        <div class="comment-form">
          <input id="commentInput" placeholder="Yorumunu yaz…" maxlength="140">
          <button id="commentSendBtn">Gönder</button>
        </div>
        <div class="save-status" id="commentStatus"></div>
      ` : ""}
    </div>
  `;
}

function renderApp(){
  const isAdmin = state.user === "anil";
  const now = Date.now();
  const list = getMatchList();
  const upcoming = list.filter(m => m.kickoffMs > now).sort((a,b)=>a.kickoffMs-b.kickoffMs);
  const past = list.filter(m => m.kickoffMs <= now).sort((a,b)=>b.kickoffMs-a.kickoffMs);

  const seenKey = `skor_seen_${state.user}`;
  const seenIds = JSON.parse(localStorage.getItem(seenKey) || "[]");
  const newlyPublished = list.filter(m => m.published && !seenIds.includes(m.id));

  return `
    <header class="top">
      <h1>Skor Tahmin <span>Ligi</span></h1>
      <div class="whoami">${PLAYERS[state.user]} olarak giriş yaptın<button id="pwToggleBtn">şifre değiştir</button><button id="logoutBtn">çıkış</button></div>
    </header>

    ${renderTicker()}

    ${newlyPublished.length ? renderNotifyBanner(newlyPublished) : ""}

    ${state.showPasswordForm ? renderPasswordForm() : ""}

    ${renderLeague(list)}

    ${isAdmin && state.suggestions.length ? renderSuggestionsList() : ""}

    ${isAdmin ? renderNewMatchForm() : renderSuggestForm()}

    <div class="section-title">Yaklaşan maçlar</div>
    ${upcoming.length ? upcoming.map(m => renderTicket(m, isAdmin)).join("") : '<div class="empty">Yaklaşan maç yok.</div>'}

    <div class="section-title">Geçmiş maçlar</div>
    ${past.length ? past.map(m => renderTicket(m, isAdmin)).join("") : '<div class="empty">Henüz oynanan maç yok.</div>'}
  `;
}

function renderNotifyBanner(matches){
  const ids = matches.map(m => m.id).join(",");
  return `
    <div class="notify-banner">
      <div class="title">Yeni sonuç yayınlandı 🔔</div>
      ${matches.map(m => `<div class="line">${m.home} ${m.result.home} - ${m.result.away} ${m.away} · sen ${m.points[state.user]} puan aldın</div>`).join("")}
      <button data-dismiss="${ids}">Gördüm</button>
    </div>
  `;
}

function renderPasswordForm(){
  return `
    <div class="new-match" id="passwordForm">
      <div class="grid">
        <div class="full"><label>Mevcut şifre</label><input type="password" id="pwCurrent" autocomplete="off"></div>
        <div><label>Yeni şifre</label><input type="password" id="pwNew" autocomplete="off"></div>
        <div><label>Yeni şifre (tekrar)</label><input type="password" id="pwNew2" autocomplete="off"></div>
      </div>
      <button class="btn" id="pwSubmitBtn">Şifreyi güncelle</button>
      <div class="save-status ${state.passwordMsg.startsWith('Hata') ? 'error' : ''}">${state.passwordMsg}</div>
    </div>
  `;
}

function renderLeague(list){
  const totals = { anil: 0, semih: 0 };
  list.forEach(m => {
    if (m.published && m.points){
      totals.anil += Number(m.points.anil || 0);
      totals.semih += Number(m.points.semih || 0);
    }
  });
  const ordered = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  return `
    <div class="section-title">Puan ligi</div>
    <div class="league">
      ${ordered.map(([key, pts], i) => `
        <div class="lrow">
          <div class="lname ${i===0 && pts>0 ? 'leader':''}"><span class="rank">${i+1}</span>${PLAYERS[key]}</div>
          <div class="lpts">${pts}</div>
        </div>
      `).join("")}
    </div>
  `;
}

const AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

function dateTimeOptions(){
  const now = new Date();
  const curYear = now.getFullYear();
  const curDay = now.getDate();
  const curMonth = now.getMonth();
  const curHour = now.getHours();
  return {
    dayOpts: Array.from({length:31}, (_,i)=>i+1).map(d => `<option value="${d}" ${d===curDay?'selected':''}>${d}</option>`).join(""),
    monthOpts: AYLAR.map((m,i) => `<option value="${i}" ${i===curMonth?'selected':''}>${m}</option>`).join(""),
    yearOpts: [curYear, curYear+1].map(y => `<option value="${y}">${y}</option>`).join(""),
    hourOpts: Array.from({length:24}, (_,i)=>i).map(h => `<option value="${h}" ${h===curHour?'selected':''}>${String(h).padStart(2,'0')}</option>`).join(""),
    minuteOpts: Array.from({length:60}, (_,i)=>i).map(mi => `<option value="${mi}">${String(mi).padStart(2,'0')}</option>`).join("")
  };
}

function renderTicket(m, isAdmin){
  const now = Date.now();
  const kickoffPassed = m.kickoffMs <= now;
  const preds = m.predictions || {};
  const myKey = state.user;
  const otherKey = myKey === "anil" ? "semih" : "anil";
  const kickoffLabel = new Date(m.kickoffMs).toLocaleString("tr-TR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });

  let predictionSection = "";
  if (!kickoffPassed){
    const myVal = preds[myKey];
    if (myVal){
      predictionSection = `
        <div class="preds">
          <div class="pred-box"><div class="name">${PLAYERS[myKey]} (sen)</div><div class="val">${myVal}</div></div>
          <div class="pred-box locked"><div class="name">${PLAYERS[otherKey]}</div><div class="val">${preds[otherKey] ? '<span class="tick">✓ girildi</span>' : '<span class="dash">— henüz yok</span>'}</div></div>
        </div>
      `;
    } else {
      predictionSection = `
        <div class="predict-row" data-match="${m.id}">
          <input type="number" min="0" class="pred-home" placeholder="0">
          <span class="dash-sep">-</span>
          <input type="number" min="0" class="pred-away" placeholder="0">
          <button class="save-btn" data-savepred="${m.id}">Kaydet</button>
        </div>
        <div class="save-status" id="predStatus-${m.id}"></div>
        <div class="preds">
          <div class="pred-box locked"><div class="name">${PLAYERS[otherKey]}</div><div class="val">${preds[otherKey] ? '<span class="tick">✓ girildi</span>' : '<span class="dash">— henüz yok</span>'}</div></div>
        </div>
      `;
    }
  } else {
    predictionSection = `
      <div class="preds">
        <div class="pred-box"><div class="name">${PLAYERS.anil}</div><div class="val">${preds.anil || '—'}</div></div>
        <div class="pred-box"><div class="name">${PLAYERS.semih}</div><div class="val">${preds.semih || '—'}</div></div>
      </div>
    `;
  }

  let resultSection = "";
  if (m.published && m.result){
    const reason = m.pointsReason || {};
    resultSection = `
      <div class="result-line"><span class="score">${m.result.home} - ${m.result.away}</span><span class="tag">Yayınlandı</span></div>
      <div class="points-row">
        <div class="points-pill"><span class="name">${PLAYERS.anil}</span><span class="pts">${m.points.anil} puan</span></div>
        <div class="points-pill"><span class="name">${PLAYERS.semih}</span><span class="pts">${m.points.semih} puan</span></div>
      </div>
      ${(reason.anil || reason.semih) ? `
        <div class="reason-box">
          ${reason.anil ? `<div>${PLAYERS.anil}: ${reason.anil}</div>` : ""}
          ${reason.semih ? `<div>${PLAYERS.semih}: ${reason.semih}</div>` : ""}
        </div>
      ` : ""}
    `;
  } else if (isAdmin && kickoffPassed){
    resultSection = `
      <div class="admin-form" data-match="${m.id}" data-home="${m.home}" data-away="${m.away}" data-kickoff="${m.kickoff}" data-pred-anil="${preds.anil || ''}" data-pred-semih="${preds.semih || ''}">
        <div class="label">Gerçek skor</div>
        <div class="grid2"><input type="number" min="0" class="res-home" placeholder="Ev sahibi gol"><input type="number" min="0" class="res-away" placeholder="Deplasman gol"></div>
        <button type="button" class="fetch-btn" data-fetchscore="${m.id}">Skoru internetten getir</button>
        <div class="save-status" id="fetchStatus-${m.id}"></div>
        <div class="label" style="margin-top:10px;">Puanlar (otomatik önerilir, değiştirebilirsin)</div>
        <div class="grid2"><input type="number" class="pts-anil" placeholder="Anıl puanı"><input type="number" class="pts-semih" placeholder="Semih puanı"></div>
        <button class="publish-btn" data-publish="${m.id}">Yayınla</button>
        <div class="save-status" id="pubStatus-${m.id}"></div>
      </div>
    `;
  } else if (kickoffPassed){
    resultSection = `<div class="pending">Sonuç henüz girilmedi.</div>`;
  }

  return `
    <div class="ticket">
      <div class="head">
        <div class="head-left">
          <div class="teams">${m.home}<span class="vs">vs</span>${m.away}</div>
          <div class="kickoff ${kickoffPassed ? '' : 'live'}">${kickoffLabel}</div>
        </div>
        ${isAdmin ? `<button class="delete-btn" data-delete="${m.id}">Maçı sil</button>` : ""}
      </div>
      <div class="divider"></div>
      <div class="body">${predictionSection}${resultSection}</div>
    </div>
  `;
}

function applyAutoPoints(form){
  const resHome = form.querySelector(".res-home").value;
  const resAway = form.querySelector(".res-away").value;
  if (resHome === "" || resAway === "") return;
  const predAnil = form.dataset.predAnil;
  const predSemih = form.dataset.predSemih;
  const anilResult = calcPoints(predAnil, Number(resHome), Number(resAway));
  const semihResult = calcPoints(predSemih, Number(resHome), Number(resAway));
  form.querySelector(".pts-anil").value = anilResult.points;
  form.querySelector(".pts-semih").value = semihResult.points;
  form.dataset.reasonAnil = anilResult.reason;
  form.dataset.reasonSemih = semihResult.reason;
}

// ---------------- EVENTS ----------------
function bindEvents(){
  document.querySelectorAll("[data-pick]").forEach(btn=>{
    btn.onclick = () => { state.loginPick = btn.dataset.pick; render(); };
  });

  const loginBtn = document.getElementById("loginBtn");
  if (loginBtn){
    loginBtn.onclick = () => {
      const val = document.getElementById("keyInput").value;
      const expected = state.loginPick === "anil" ? state.keys.anil : state.keys.semih;
      if (val === expected && val.length > 0){
        state.user = state.loginPick;
        localStorage.setItem("skor_user", state.user);
        render();
      } else {
        document.getElementById("loginErr").textContent = "Şifre yanlış.";
      }
    };
    document.getElementById("keyInput").addEventListener("keydown", e=>{ if (e.key === "Enter") loginBtn.click(); });
  }

  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn){
    logoutBtn.onclick = () => { state.user = null; localStorage.removeItem("skor_user"); render(); };
  }

  const dismissBtn = document.querySelector("[data-dismiss]");
  if (dismissBtn){
    dismissBtn.onclick = () => {
      const ids = dismissBtn.dataset.dismiss.split(",");
      const seenKey = `skor_seen_${state.user}`;
      const seenIds = JSON.parse(localStorage.getItem(seenKey) || "[]");
      localStorage.setItem(seenKey, JSON.stringify([...new Set([...seenIds, ...ids])]));
      render();
    };
  }

  const commentSendBtn = document.getElementById("commentSendBtn");
  if (commentSendBtn){
    const sendComment = async () => {
      const input = document.getElementById("commentInput");
      const text = input.value.trim();
      const status = document.getElementById("commentStatus");
      if (!text) return;
      const newComment = { id: String(Date.now()), user: state.user, text, createdAt: Date.now() };
      state.comments.push(newComment);
      commentSendBtn.disabled = true;
      status.textContent = "Gönderiliyor…"; status.className = "save-status";
      try{
        await saveComments();
        render();
      }catch(e){
        state.comments.pop();
        status.textContent = "Gönderilemedi: " + e.message; status.className = "save-status error";
        commentSendBtn.disabled = false;
      }
    };
    commentSendBtn.onclick = sendComment;
    document.getElementById("commentInput").addEventListener("keydown", e => { if (e.key === "Enter") sendComment(); });
  }

  const pwToggleBtn = document.getElementById("pwToggleBtn");
  if (pwToggleBtn){
    pwToggleBtn.onclick = () => {
      state.showPasswordForm = !state.showPasswordForm;
      state.passwordMsg = "";
      render();
    };
  }

  const pwSubmitBtn = document.getElementById("pwSubmitBtn");
  if (pwSubmitBtn){
    pwSubmitBtn.onclick = async () => {
      const current = document.getElementById("pwCurrent").value;
      const next = document.getElementById("pwNew").value;
      const next2 = document.getElementById("pwNew2").value;
      if (current !== state.keys[state.user]){
        state.passwordMsg = "Hata: mevcut şifre yanlış."; render(); return;
      }
      if (!next || next.length < 4){
        state.passwordMsg = "Hata: yeni şifre en az 4 karakter olmalı."; render(); return;
      }
      if (next !== next2){
        state.passwordMsg = "Hata: yeni şifreler eşleşmiyor."; render(); return;
      }
      pwSubmitBtn.disabled = true;
      state.passwordMsg = "Güncelleniyor…"; render();
      try{
        await saveKey(state.user, next);
        state.showPasswordForm = false;
        state.passwordMsg = "";
        render();
      }catch(e){
        state.passwordMsg = "Hata: kaydedilemedi - " + e.message; render();
      }
    };
  }

  const createBtn = document.getElementById("createMatchBtn");
  if (createBtn){
    createBtn.onclick = async () => {
      const home = document.getElementById("homeTeam").value.trim();
      const away = document.getElementById("awayTeam").value.trim();
      const status = document.getElementById("newMatchStatus");
      if (!home || !away){
        status.textContent = "Takım isimlerini gir."; status.className = "save-status error";
        return;
      }
      const day = Number(document.getElementById("dayInput").value);
      const month = Number(document.getElementById("monthInput").value);
      const year = Number(document.getElementById("yearInput").value);
      const hour = Number(document.getElementById("hourInput").value);
      const minute = Number(document.getElementById("minuteInput").value);
      // Tarayıcının kendi yerel saatine göre bir Date oluşturuyoruz (UTC'ye çevirmiyoruz burada,
      // new Date(y,m,d,h,mi) zaten tarayıcının local saatini kullanır).
      const kickoffDate = new Date(year, month, day, hour, minute, 0);
      if (isNaN(kickoffDate.getTime())){
        status.textContent = "Geçersiz tarih."; status.className = "save-status error";
        return;
      }
      const kickoff = kickoffDate.toISOString();
      const newId = String(Date.now());
      state.matches.push({ id: newId, home, away, kickoff, predictions: {}, result: null, points: null, published: false });
      createBtn.disabled = true;
      status.textContent = "Kaydediliyor…"; status.className = "save-status";
      try{ await saveData(); render(); }
      catch(e){
        state.matches.pop();
        status.textContent = "Kaydedilemedi: " + e.message; status.className = "save-status error"; createBtn.disabled = false;
      }
    };
  }

  const sendSuggestionBtn = document.getElementById("sendSuggestionBtn");
  if (sendSuggestionBtn){
    sendSuggestionBtn.onclick = async () => {
      const home = document.getElementById("sHomeTeam").value.trim();
      const away = document.getElementById("sAwayTeam").value.trim();
      const status = document.getElementById("suggestStatus");
      if (!home || !away){
        status.textContent = "Takım isimlerini gir."; status.className = "save-status error";
        return;
      }
      const day = Number(document.getElementById("sDayInput").value);
      const month = Number(document.getElementById("sMonthInput").value);
      const year = Number(document.getElementById("sYearInput").value);
      const hour = Number(document.getElementById("sHourInput").value);
      const minute = Number(document.getElementById("sMinuteInput").value);
      const kickoffDate = new Date(year, month, day, hour, minute, 0);
      if (isNaN(kickoffDate.getTime())){
        status.textContent = "Geçersiz tarih."; status.className = "save-status error";
        return;
      }
      const kickoff = kickoffDate.toISOString();
      const newId = String(Date.now());
      state.suggestions.push({ id: newId, home, away, kickoff, suggestedBy: state.user });
      sendSuggestionBtn.disabled = true;
      status.textContent = "Gönderiliyor…"; status.className = "save-status";
      try{
        await saveSuggestions();
        status.textContent = "Anıl'a gönderildi, onayını bekliyor.";
        sendSuggestionBtn.disabled = false;
      }catch(e){
        state.suggestions.pop();
        status.textContent = "Gönderilemedi: " + e.message; status.className = "save-status error";
        sendSuggestionBtn.disabled = false;
      }
    };
  }

  document.querySelectorAll("[data-approve]").forEach(btn=>{
    btn.onclick = async () => {
      const suggId = btn.dataset.approve;
      const sugg = state.suggestions.find(s => s.id === suggId);
      if (!sugg) return;
      btn.disabled = true;
      const newMatch = { id: String(Date.now()), home: sugg.home, away: sugg.away, kickoff: sugg.kickoff, predictions: {}, result: null, points: null, published: false };
      const matchesBackup = state.matches;
      const suggBackup = state.suggestions;
      state.matches = [...state.matches, newMatch];
      state.suggestions = state.suggestions.filter(s => s.id !== suggId);
      try{
        await saveData();
        await saveSuggestions();
        render();
      }catch(e){
        state.matches = matchesBackup;
        state.suggestions = suggBackup;
        alert("Onaylanamadı: " + e.message);
        render();
      }
    };
  });

  document.querySelectorAll("[data-reject]").forEach(btn=>{
    btn.onclick = async () => {
      const suggId = btn.dataset.reject;
      const backup = state.suggestions;
      state.suggestions = state.suggestions.filter(s => s.id !== suggId);
      btn.disabled = true;
      try{ await saveSuggestions(); render(); }
      catch(e){
        state.suggestions = backup;
        alert("Reddedilemedi: " + e.message);
        render();
      }
    };
  });

  document.querySelectorAll("[data-savepred]").forEach(btn=>{
    btn.onclick = async () => {
      const matchId = btn.dataset.savepred;
      const row = btn.closest(".predict-row");
      const home = row.querySelector(".pred-home").value;
      const away = row.querySelector(".pred-away").value;
      const status = document.getElementById(`predStatus-${matchId}`);
      if (home === "" || away === "") return;
      const match = state.matches.find(m => m.id === matchId);
      if (!match.predictions) match.predictions = {};
      match.predictions[state.user] = `${home}-${away}`;
      btn.disabled = true;
      status.textContent = "Kaydediliyor…"; status.className = "save-status";
      try{ await saveData(); render(); }
      catch(e){
        delete match.predictions[state.user];
        status.textContent = "Kaydedilemedi: " + e.message; status.className = "save-status error";
        btn.disabled = false;
      }
    };
  });

  document.querySelectorAll("[data-fetchscore]").forEach(btn=>{
    btn.onclick = async () => {
      const matchId = btn.dataset.fetchscore;
      const form = btn.closest(".admin-form");
      const status = document.getElementById(`fetchStatus-${matchId}`);
      btn.disabled = true;
      status.textContent = "Aranıyor…"; status.className = "save-status";
      const found = await fetchRealScore(form.dataset.home, form.dataset.away, form.dataset.kickoff);
      btn.disabled = false;
      if (found){
        form.querySelector(".res-home").value = found.home;
        form.querySelector(".res-away").value = found.away;
        status.textContent = "Bulundu, kontrol edip yayınlayabilirsin."; status.className = "save-status";
        applyAutoPoints(form);
      } else {
        status.textContent = "Bulunamadı, skoru elle gir."; status.className = "save-status error";
      }
    };
  });

  document.querySelectorAll(".admin-form .res-home, .admin-form .res-away").forEach(input=>{
    input.addEventListener("input", () => applyAutoPoints(input.closest(".admin-form")));
  });

  document.querySelectorAll("[data-publish]").forEach(btn=>{
    btn.onclick = async () => {
      const matchId = btn.dataset.publish;
      const form = btn.closest(".admin-form");
      const resHome = form.querySelector(".res-home").value;
      const resAway = form.querySelector(".res-away").value;
      const ptsAnil = form.querySelector(".pts-anil").value;
      const ptsSemih = form.querySelector(".pts-semih").value;
      const status = document.getElementById(`pubStatus-${matchId}`);
      if (resHome === "" || resAway === "" || ptsAnil === "" || ptsSemih === "") return;
      const match = state.matches.find(m => m.id === matchId);
      match.result = { home: Number(resHome), away: Number(resAway) };
      match.points = { anil: Number(ptsAnil), semih: Number(ptsSemih) };
      match.pointsReason = {
        anil: form.dataset.reasonAnil || "",
        semih: form.dataset.reasonSemih || ""
      };
      match.published = true;
      btn.disabled = true;
      status.textContent = "Yayınlanıyor…"; status.className = "save-status";
      try{ await saveData(); render(); }
      catch(e){
        match.published = false;
        status.textContent = "Kaydedilemedi: " + e.message; status.className = "save-status error";
        btn.disabled = false;
      }
    };
  });

  document.querySelectorAll("[data-delete]").forEach(btn=>{
    btn.onclick = async () => {
      const matchId = btn.dataset.delete;
      const match = state.matches.find(m => m.id === matchId);
      if (!confirm(`${match.home} - ${match.away} maçını silmek istediğine emin misin?`)) return;
      const backup = state.matches;
      state.matches = state.matches.filter(m => m.id !== matchId);
      btn.disabled = true;
      try{ await saveData(); render(); }
      catch(e){
        state.matches = backup;
        alert("Silinemedi: " + e.message);
        render();
      }
    };
  });
}

keysRef.on("value", snap => {
  const val = snap.val();
  if (val && val.anil && val.semih){
    state.keys = val;
  } else {
    keysRef.set({ anil: CONFIG.ANIL_KEY, semih: CONFIG.SEMIH_KEY });
  }
  render();
});

matchesRef.on("value", snap => {
  state.matches = snap.val() || [];
  render();
});

suggestionsRef.on("value", snap => {
  state.suggestions = snap.val() || [];
  render();
});

commentsRef.on("value", snap => {
  state.comments = snap.val() || [];
  render();
});
</script>
